<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student Login — Mind & Muse</title>
<link rel="stylesheet" href="style.css">

<style>
.login-page{
  max-width:760px;
  margin:0 auto;
  padding:10vw 7vw 12vw;
  text-align:center;
}

.login-page h1{
  font-size:clamp(48px,7vw,78px);
  line-height:1;
  letter-spacing:-.045em;
  font-weight:500;
  margin:0 0 28px;
}

.login-page h1 em{
  font-family:'Playfair Display',serif;
  font-weight:500;
}

.login-page > p{
  color:var(--muted);
  font-size:18px;
  max-width:600px;
  margin:0 auto 40px;
}

.login-box{
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  padding:40px 0;
  text-align:left;
  max-width:500px;
  margin:0 auto;
}

.login-box label{
  display:block;
  font-size:13px;
  font-weight:600;
  margin-bottom:20px;
}

.login-box input{
  width:100%;
  margin-top:8px;
  padding:14px 15px;
  border:1px solid var(--line);
  background:#fff;
  font:inherit;
  color:var(--ink);
}

.login-box button{
  width:100%;
  cursor:pointer;
  margin-top:10px;
}

.secondary-button{
  width:100%;
  cursor:pointer;
  margin-top:12px;
  background:transparent;
  color:var(--ink);
}

.login-message{
  text-align:center;
  font-size:13px;
  color:var(--muted);
  margin-top:24px;
  min-height:20px;
}

.login-switch{
  text-align:center;
  font-size:13px;
  margin-top:24px;
}

.login-switch a{
  text-decoration:underline;
  cursor:pointer;
}

@media(max-width:800px){
  .login-page{
    padding:70px 20px 80px;
  }

  .login-page h1{
    font-size:46px;
  }

  .login-page > p{
    font-size:16px;
  }
}
</style>
</head>

<body>

<header>
  <a class="logo" href="index.html">MIND & MUSE</a>

  <nav>
    <a href="index.html">Home</a>
    <a href="piano.html">Piano</a>
    <a href="english.html">English</a>
    <a href="chess.html">Chess</a>
    <a class="nav-cta" href="booking.html">Book a Lesson</a>
    <a class="nav-cta" href="student-login.html">Student Login</a>
    <a href="https://mindandmuse-github-io.translate.goog/?_x_tr_sl=en&_x_tr_tl=fr&_x_tr_hl=en">🌐 Translate</a>
  </nav>
</header>

<main>

<section class="login-page">

<p class="eyebrow">STUDENT AREA</p>

<h1>
  Welcome back.<br>
  <em>Your learning space.</em>
</h1>

<p id="intro-text">
  Log in to your Mind & Muse student account.
</p>

<div class="login-box">

<label id="name-label" style="display:none;">
  Full name
  <input id="full-name" type="text" placeholder="Your full name" autocomplete="name">
</label>

<label>
  Email address
  <input id="email" type="email" placeholder="Your email address" autocomplete="email">
</label>

<label>
  Password
  <input id="password" type="password" placeholder="Your password" autocomplete="current-password">
</label>
  
  <label id="confirm-password-label" style="display:none;">
  Confirm password
  <input id="confirm-password" type="password" placeholder="Confirm your password">
</label>

<button class="button" id="login-button" type="button">
  Log In
</button>

<button class="button secondary-button" id="signup-button" type="button" style="display:none;">
  Create an Account
</button>

<p class="login-switch" id="switch-text">
  Don't have an account?
  <button class="auth-link" id="switch-mode" type="button">Create one</button>
</p>

<p class="login-message" id="message"></p>

<p class="login-switch">
  Your account is created securely through Mind & Muse.
</p>

</div>

</section>

</main>

<footer>
  <span>© 2026 Mind & Muse</span>
  <span>Learn · Create · Express</span>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://yqkenojjfergqfslbpts.supabase.co";

const SUPABASE_KEY = "sb_publishable_8lZ1sx8R_-p9aryao9IrtA_XqRWEHSm";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);
  
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const confirmPasswordInput = document.getElementById("confirm-password");
const loginButton = document.getElementById("login-button");
const signupButton = document.getElementById("signup-button");
const message = document.getElementById("message");
const confirmPasswordLabel = document.getElementById("confirm-password-label");
const switchMode = document.getElementById("switch-mode");
const switchText = document.getElementById("switch-text");

function showMessage(text) {
  message.textContent = text;
}
let createMode = false;

switchMode.addEventListener("click", () => {
  createMode = !createMode;

  confirmPasswordLabel.style.display = createMode ? "block" : "none";
  loginButton.style.display = createMode ? "none" : "block";
  signupButton.style.display = createMode ? "block" : "none";

  if (createMode) {
    switchText.innerHTML =
      'Already have an account? <button class="auth-link" id="switch-mode" type="button">Log in</button>';
  } else {
    switchText.innerHTML =
      'Don\'t have an account? <button class="auth-link" id="switch-mode" type="button">Create one</button>';
  }

  document.getElementById("switch-mode").addEventListener("click", () => {
    switchMode.click();
  });

  showMessage("");
});
  
loginButton.addEventListener("click", async () => {

 const email = emailInput.value.trim();
const password = passwordInput.value;

  if (!email || !password) {
    showMessage("Please enter your email and password.");
    return;
  }

  showMessage("Logging in...");

  const { error } = await supabaseClient.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    showMessage(error.message);
    return;
  }

  window.location.href = "account.html";
});

signupButton.addEventListener("click", async () => {

  const email = emailInput.value.trim();
  const password = passwordInput.value;
  const confirmPassword = confirmPasswordInput.value;

  if (!email || !password) {
    showMessage("Please enter an email and password.");
    return;
  }

  if (password !== confirmPassword) {
  showMessage("Passwords do not match.");
  return;
}

  if (password.length < 6) {
    showMessage("Your password must contain at least 6 characters.");
    return;
  }

  showMessage("Creating your account...");

  const { error } = await supabaseClient.auth.signUp({
    email,
    password,
    options: {
      emailRedirectTo: "https://mindandmuse.github.io/account.html"
    }
  });

  if (error) {
    showMessage(error.message);
    return;
  }

  showMessage(
    "Account created. Please check your email to confirm your account."
  );
});
</script>

</body>
</html>
